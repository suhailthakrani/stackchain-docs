<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="How stackchain works">
  <rect width="720" height="420" rx="12" fill="#151B22"/>
  <text x="32" y="42" fill="#9AABBC" font-family="IBM Plex Mono, monospace" font-size="13">HOW IT WORKS</text>

  <!-- boxes -->
  <rect x="40" y="80" width="140" height="64" rx="10" fill="#1A222C" stroke="#243040"/>
  <text x="110" y="108" text-anchor="middle" fill="#E8EEF4" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">stackchain.yaml</text>
  <text x="110" y="128" text-anchor="middle" fill="#9AABBC" font-family="IBM Plex Mono, monospace" font-size="11">config + presets</text>

  <path d="M190 112 H230" stroke="#2EE6A6" stroke-width="2"/>
  <polygon points="230,106 242,112 230,118" fill="#2EE6A6"/>

  <rect x="250" y="80" width="140" height="64" rx="10" fill="#1A222C" stroke="#2EE6A6"/>
  <text x="320" y="108" text-anchor="middle" fill="#2EE6A6" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">CLI engine</text>
  <text x="320" y="128" text-anchor="middle" fill="#9AABBC" font-family="IBM Plex Mono, monospace" font-size="11">init · feature · sync</text>

  <path d="M400 112 H440" stroke="#2EE6A6" stroke-width="2"/>
  <polygon points="440,106 452,112 440,118" fill="#2EE6A6"/>

  <rect x="460" y="80" width="200" height="64" rx="10" fill="#1A222C" stroke="#243040"/>
  <text x="560" y="108" text-anchor="middle" fill="#E8EEF4" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">Generated Flutter app</text>
  <text x="560" y="128" text-anchor="middle" fill="#9AABBC" font-family="IBM Plex Mono, monospace" font-size="11">app · core · features</text>

  <!-- bottom row -->
  <rect x="80" y="220" width="160" height="56" rx="10" fill="#1A222C" stroke="#243040"/>
  <text x="160" y="253" text-anchor="middle" fill="#E8EEF4" font-family="IBM Plex Sans, sans-serif" font-size="13">Templates</text>

  <rect x="280" y="220" width="160" height="56" rx="10" fill="#1A222C" stroke="#243040"/>
  <text x="360" y="253" text-anchor="middle" fill="#E8EEF4" font-family="IBM Plex Sans, sans-serif" font-size="13">Smart merge</text>

  <rect x="480" y="220" width="160" height="56" rx="10" fill="#1A222C" stroke="#243040"/>
  <text x="560" y="253" text-anchor="middle" fill="#E8EEF4" font-family="IBM Plex Sans, sans-serif" font-size="13">Quality gate</text>

  <path d="M320 144 V190" stroke="#2EE6A6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M160 190 H560" stroke="#2EE6A6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M160 190 V220" stroke="#2EE6A6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M360 190 V220" stroke="#2EE6A6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M560 190 V220" stroke="#2EE6A6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="360" y="340" text-anchor="middle" fill="#9AABBC" font-family="IBM Plex Sans, sans-serif" font-size="13">Hand-written code outside &lt;stackchain:&&gt; regions is preserved</text>
  <text x="360" y="370" text-anchor="middle" fill="#2EE6A6" font-family="IBM Plex Mono, monospace" font-size="12">.stackchain/lock.yaml · doctor · upgrade · migrate</text>
</svg>
